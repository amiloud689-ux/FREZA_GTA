
name: Build FREZA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip FREZA_ANDROID_NATIVE_PROJECT.zip -d project

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug
      - name: Fix Java source
        run: |
          sed -i 's/static class GameView/class GameView/' project/app/src/main/java/com/freza/openworld/MainActivity.java
      - uses: actions/upload-artifact@v4
        with:
          name: FREZA-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
